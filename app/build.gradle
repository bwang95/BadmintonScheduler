import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

kotlin {
  compilerOptions {
    jvmTarget = JvmTarget.JVM_21
  }
}

android {
  namespace package_name
  compileSdkVersion 36

  buildFeatures {
    buildConfig = true
    compose = true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }

  defaultConfig {
    applicationId package_name
    minSdkVersion 23
    targetSdkVersion 36
    versionCode major_version * 1000 + minor_version
    versionName "$major_version.$minor_version"
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }

  buildTypes {
    debug {
      applicationIdSuffix '.debug'
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }
}

ext {
  okhttp_version = '5.3.2'
  retrofit_version = '3.0.0'
  moshi_version = '1.15.2'
  dagger_version = '2.57.2'
  lifecycle_version = '2.10.0'
  room_version = '2.8.4'
}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'com.google.android.material:material:1.13.0'

  // ViewModel
  implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
  implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"
  implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
  implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

  // Room
  implementation "androidx.room:room-runtime:$room_version"
  ksp "androidx.room:room-compiler:$room_version"

  implementation 'androidx.activity:activity-ktx:1.12.0'
  implementation 'androidx.fragment:fragment-ktx:1.8.9'

  // Compose
  implementation 'androidx.activity:activity-compose:1.12.0'
  implementation 'androidx.compose.material:material:1.9.5'
  implementation 'androidx.compose.animation:animation:1.9.5'
  implementation 'androidx.compose.ui:ui-tooling:1.9.5'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

  implementation "com.google.dagger:dagger:$dagger_version"
  ksp "com.google.dagger:dagger-compiler:$dagger_version"

  implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
  implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"
  implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
  implementation "com.squareup.retrofit2:converter-moshi:$retrofit_version"
  implementation "com.squareup.moshi:moshi:$moshi_version"
  implementation "com.squareup.moshi:moshi-kotlin:$moshi_version"
}
